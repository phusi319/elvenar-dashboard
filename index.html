<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Elvenar Live Radar</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-green-bg: rgba(16, 185, 129, 0.15);
      --accent-amber: #f59e0b;
      --accent-amber-bg: rgba(245, 158, 11, 0.15);
      --accent-rose: #f43f5e;
      --accent-rose-bg: rgba(244, 63, 94, 0.15);
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 14px 60px 14px;
      overflow-x: hidden;
      line-height: 1.4;
    }

    /* Ambient Glow Background */
    body::before {
      content: "";
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 26px;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.4));
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-green-bg);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Section Styles */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 18px 4px 8px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Card Layout */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 9px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .card:active {
      transform: scale(0.99);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .card-title .icon {
      font-size: 17px;
    }

    .pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill-green {
      background: var(--accent-green-bg);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .pill-amber {
      background: var(--accent-amber-bg);
      color: var(--accent-amber);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .pill-rose {
      background: var(--accent-rose-bg);
      color: var(--accent-rose);
      border: 1px solid rgba(244, 63, 94, 0.25);
    }

    .pill-blue {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    /* Timer Display */
    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 4px;
    }

    .timer-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .timer-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-text {
      font-size: 13px;
      font-weight: 600;
    }

    .status-text.ready {
      color: var(--accent-amber);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-text.idle {
      color: var(--accent-rose);
    }

    /* Provision Spell Banner */
    .spell-banner {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12) 0%, rgba(217, 119, 6, 0.05) 100%);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .spell-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spell-icon {
      font-size: 18px;
      filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.6));
    }

    .spell-name {
      font-size: 12px;
      font-weight: 700;
      color: #fef08a;
    }

    .spell-timer {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      font-weight: 700;
      color: #fef08a;
    }

    /* Grid for AWs and Pets */
    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mini-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 82px;
    }

    .mini-title {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-timer {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-top: 6px;
    }

    .mini-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Footer Buttons */
    .footer {
      margin-top: 24px;
      text-align: center;
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-close:active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .sync-note {
      font-size: 11px;
      color: #64748b;
      margin-top: 10px;
    }

    /* Live Update Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.3s;
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* =========================================================================
       🗂️ TAB BAR & MULTI-TAB NAVIGATION STYLES
       ========================================================================= */
    .tab-bar {
      display: flex;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      gap: 6px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.2);
    }

    .tab-panel {
      display: none;
      animation: tabFadeIn 0.22s ease;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes tabFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Period Toggle Bar (Today vs This Week) */
    .period-toggle-bar {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 14px;
      gap: 4px;
    }

    .period-btn {
      flex: 1;
      padding: 8px 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .period-btn.active {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.15);
    }

    /* Grand Total KPI Card */
    .grand-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .grand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .kpi-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
    }

    .kpi-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .kpi-value {
      font-size: 13px;
      font-weight: 800;
    }

    .val-green { color: #34d399; }
    .val-red { color: #f43f5e; }
    .val-blue { color: #38bdf8; }

    /* Tier Card & Resource Table */
    .tier-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .tier-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tier-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .resource-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
      font-size: 12px;
    }

    .resource-row:last-child {
      border-bottom: none;
    }

    .res-name-col {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 105px;
    }

    .res-name-col .res-icon {
      font-size: 17px;
    }

    .res-name-col .res-name {
      font-weight: 600;
      color: #f1f5f9;
      font-size: 12px;
    }

    .res-stats-col {
      display: flex;
      gap: 12px;
      text-align: right;
    }

    .res-stat-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .res-stat-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .res-stat-val {
      font-size: 11px;
      font-weight: 700;
    }

    .tier-summary-row {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 9px;
      padding: 8px 10px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tier-sum-title {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .tier-sum-stats {
      display: flex;
      gap: 10px;
      font-size: 11px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="brand-icon">🏰</span>
        <div class="brand-text">
          <h1>Elvenar Live Radar</h1>
          <p id="syncTime">Connecting to game data...</p>
        </div>
      </div>
      <div class="live-badge" id="liveBadge" onclick="reconnectStream()">
        <span class="pulse-dot"></span>
        <span id="liveBadgeText">STREAMING (LIVE)</span>
      </div>
    </header>

    <!-- Config-Driven Tab Navigation Bar -->
    <nav class="tab-bar" id="tabBar">
      <!-- Injected dynamically via JS based on APP_TABS config -->
    </nav>

    <!-- Tab 1: Production -->
    <div id="tabPanel_production" class="tab-panel active">
      <!-- 1. Military Queues -->
      <div class="section-title">
        <span>⚔️</span> Military Queues
      </div>
      <div id="militaryList">
        <!-- Injected via JS -->
      </div>

      <!-- 2. Main Workshops -->
      <div class="section-title">
        <span>🏭</span> Workshops
      </div>
      <div id="workshopCard">
        <!-- Injected via JS -->
      </div>

      <!-- 3. Ancient Wonders -->
      <div class="section-title">
        <span>🏛️</span> Ancient Wonders
      </div>
      <div class="two-col-grid" id="awGrid">
        <!-- Injected via JS -->
      </div>

      <!-- 4. Pet Food Buffs -->
      <div class="section-title">
        <span>🍖</span> Pet Food Buffs
      </div>
      <div class="two-col-grid" id="petGrid">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Tab 2: Resources -->
    <div id="tabPanel_resources" class="tab-panel" style="display: none;">
      <!-- Period Selector: Today vs This Week -->
      <div class="period-toggle-bar">
        <button class="period-btn active" id="periodBtn_today" onclick="switchPeriod('today')">📅 Today (00:00 - 23:59)</button>
        <button class="period-btn" id="periodBtn_week" onclick="switchPeriod('week')">📊 This Week (Sun - Sat)</button>
      </div>

      <div id="resourcesContent">
        <!-- Injected dynamically via JS: Tier 1 + Tier 2 + Tier 3 -->
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <button class="btn-close" onclick="closeWebApp()">Close Dashboard</button>
      <p class="sync-note" id="syncDetails">Realtime Stream (&lt;1s) • Synced from PC Game Client</p>
    </footer>

    <!-- Toast Notification -->
    <div id="liveToast" class="toast">✨ Game data updated!</div>
  </div>

  <script>
    // =========================================================================
    // 🗂️ TAB CONFIGURATION & ORDER (CONFIG-DRIVEN UI)
    // Easily reorder tabs by swapping items in the array below
    // =========================================================================
    const APP_TABS = [
      { id: "production", title: "Production", icon: "⚔️", enabled: true },
      { id: "resources",  title: "Resources",  icon: "💎", enabled: true }
    ];

    let currentTabId = localStorage.getItem("elvenar_active_tab") || APP_TABS[0].id;
    let currentPeriod = "today"; // "today" (00:00 - 23:59) or "week" (Sun - Sat)

    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function triggerHaptic() {
      // Disabled completely per user request - no vibration on update or interactions
    }

    function closeWebApp() {
      if (tg) tg.close();
      else window.close();
    }

    function showToast(msg) {
      const t = document.getElementById("liveToast");
      if (!t) return;
      t.innerText = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    // Format Seconds to HH:MM:SS
    function formatDuration(sec) {
      const s = Math.max(0, Math.floor(sec));
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const remSec = s % 60;

      if (d > 0) {
        return `${d}d ${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m`;
      }
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(remSec).padStart(2, '0')}`;
    }

    function formatCompact(num) {
      if (num === null || num === undefined) return "0";
      const n = Math.abs(num);
      if (n >= 1000000) return (num / 1000000).toFixed(2) + "M";
      if (n >= 1000) return (num / 1000).toFixed(1) + "K";
      return Number(num).toLocaleString('en-US');
    }

    function formatNumber(num) {
      if (num === null || num === undefined) return "0";
      return Number(num).toLocaleString('en-US');
    }

    // Parse Data from URL Hash or Search Params
    function getPayload() {
      try {
        let raw = "";
        const hash = window.location.hash;
        const search = window.location.search;

        if (hash && hash.includes("d=")) {
          raw = hash.split("d=")[1].split("&")[0];
        } else if (search && search.includes("d=")) {
          const params = new URLSearchParams(search);
          raw = params.get("d") || "";
        }

        if (raw) {
          let clean = raw.replace(/-/g, '+').replace(/_/g, '/');
          while (clean.length % 4) clean += '=';
          const decodedStr = decodeURIComponent(escape(atob(clean)));
          return JSON.parse(decodedStr);
        }
      } catch (e) {
        console.error("Payload decoding error:", e);
      }

      // Fallback if opened directly without URL hash
      return {
        isDemo: true,
        t: 0,
        mil: [
          { id: "b", n: "Barracks", ic: "⚔️", f: 0, f1: 0, s: 0, m: 5 },
          { id: "tg", n: "Training Grounds", ic: "🏹", f: 0, f1: 0, s: 0, m: 5 },
          { id: "mc", n: "Mercenary Camp", ic: "🪄", f: 0, f1: 0, s: 0, m: 5 }
        ],
        ws: { c: 4, l: 15, f: 0, p: 0, r: 0, i: 0, st: 0, pf: 0 },
        aw: [
          { n: "Golden Abyss", l: 0, s: "Idle", f: 0 },
          { n: "Prosperity Towers", l: 0, s: "Idle", f: 0 },
          { n: "Maze of Dark Matter", l: 0, s: "Idle", f: 0 }
        ],
        pet: [
          { n: "Brown Bear", ic: "🐻", f: 0 },
          { n: "Shellux", ic: "🐌", f: 0 }
        ],
        res: [
          { id: "marble", name: "Marble", icon: "🏛️", tier: 1, cur: 12329922, todayEarn: 0, todaySpent: 0, weekEarn: 0, weekSpent: 0 },
          { id: "steel", name: "Steel", icon: "🔩", tier: 1, cur: 11593828, todayEarn: 0, todaySpent: 0, weekEarn: 0, weekSpent: 0 },
          { id: "planks", name: "Planks", icon: "🪵", tier: 1, cur: 9270106, todayEarn: 0, todaySpent: 0, weekEarn: 0, weekSpent: 0 },
          { id: "crystal", name: "Crystal", icon: "💎", tier: 2, cur: 8852670, todayEarn: 0, todaySpent: 0, weekEarn: 0, weekSpent: 0 },
          { id: "scrolls", name: "Scrolls", icon: "📜", tier: 2, cur: 8073329, todayEarn: 0, todaySpent: 0, weekEarn: 0, weekSpent: 0 },
          { id: "silk", name: "Silk", icon: "🧵", tier: 2, cur: 6404746, todayEarn: 0, todaySpent: 0, weekEarn: 0, weekSpent: 0 },
          { id: "elixir", name: "Elixir", icon: "🧪", tier: 3, cur: 7994560, todayEarn: 0, todaySpent: 0, weekEarn: 0, weekSpent: 0 },
          { id: "magic_dust", name: "Magic Dust", icon: "✨", tier: 3, cur: 8682281, todayEarn: 0, todaySpent: 0, weekEarn: 0, weekSpent: 0 },
          { id: "gems", name: "Gems", icon: "🔮", tier: 3, cur: 10006642, todayEarn: 0, todaySpent: 0, weekEarn: 0, weekSpent: 0 }
        ]
      };
    }

    let state = getPayload();

    function renderTabBar() {
      const bar = document.getElementById("tabBar");
      if (!bar) return;
      const activeTabs = APP_TABS.filter(t => t.enabled !== false);
      bar.innerHTML = activeTabs.map(t => `
        <button class="tab-btn ${t.id === currentTabId ? 'active' : ''}" id="tabBtn_${t.id}" onclick="switchTab('${t.id}')">
          <span class="tab-icon">${t.icon}</span>
          <span class="tab-label">${t.title}</span>
        </button>
      `).join('');
    }

    function switchTab(tabId) {
      currentTabId = tabId;
      try { localStorage.setItem("elvenar_active_tab", tabId); } catch(e) {}

      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      const activeBtn = document.getElementById(`tabBtn_${tabId}`);
      if (activeBtn) activeBtn.classList.add("active");

      document.querySelectorAll(".tab-panel").forEach(panel => panel.style.display = "none");
      const activePanel = document.getElementById(`tabPanel_${tabId}`);
      if (activePanel) activePanel.style.display = "block";

      if (tabId === "resources") {
        renderResourcesUI();
      }
    }

    function switchPeriod(period) {
      currentPeriod = period;
      document.querySelectorAll(".period-btn").forEach(btn => btn.classList.remove("active"));
      const activeBtn = document.getElementById(`periodBtn_${period}`);
      if (activeBtn) activeBtn.classList.add("active");
      renderResourcesUI();
    }

    function renderResourcesUI() {
      const container = document.getElementById("resourcesContent");
      if (!container) return;

      const goods = state.res || [];
      const isToday = currentPeriod === "today";

      function getStats(g) {
        const earn = isToday ? (g.todayEarn || 0) : (g.weekEarn || 0);
        const spent = isToday ? (g.todaySpent || 0) : (g.weekSpent || 0);
        const net = earn - spent;
        return { earn, spent, net, cur: (g.cur || 0) };
      }

      const tiers = [
        { id: 1, title: "Tier 1: Basic Goods", icon: "📦", goods: goods.filter(g => g.tier === 1) },
        { id: 2, title: "Tier 2: Refined Goods", icon: "💎", goods: goods.filter(g => g.tier === 2) },
        { id: 3, title: "Tier 3: Precious Goods", icon: "🧪", goods: goods.filter(g => g.tier === 3) }
      ];

      let html = "";

      // Render each Tier card with summary and individual goods
      tiers.forEach(t => {
        let tEarn = 0, tSpent = 0;
        t.goods.forEach(g => {
          const s = getStats(g);
          tEarn += s.earn;
          tSpent += s.spent;
        });
        const tNet = tEarn - tSpent;

        html += `
          <div class="tier-card">
            <div class="tier-header">
              <div class="tier-title">
                <span>${t.icon}</span>
                <span>${t.title}</span>
              </div>
            </div>

            <!-- Tier Summary Row (Aggregated for all 3 goods in this tier) -->
            <div class="tier-summary-row">
              <span class="tier-sum-title">📊 Tier ${t.id} Total</span>
              <div class="tier-sum-stats">
                <span class="val-green">+${formatCompact(tEarn)}</span>
                <span class="val-red">-${formatCompact(tSpent)}</span>
                <span class="${tNet >= 0 ? 'val-green' : 'val-red'}">Net: ${tNet >= 0 ? '+' : ''}${formatCompact(tNet)}</span>
              </div>
            </div>

            <!-- 3 Rows for the 3 Goods in this Tier -->
            <div style="margin-top: 6px;">
        `;

        t.goods.forEach(g => {
          const s = getStats(g);
          html += `
            <div class="resource-row">
              <div class="res-name-col">
                <span class="res-icon">${g.icon}</span>
                <div>
                  <div class="res-name">${g.name}</div>
                  <div style="font-size:10px; color:#64748b;">Stock: ${formatCompact(s.cur)}</div>
                </div>
              </div>
              <div class="res-stats-col">
                <div class="res-stat-item">
                  <span class="res-stat-label">Earned</span>
                  <span class="res-stat-val val-green">+${formatCompact(s.earn)}</span>
                </div>
                <div class="res-stat-item">
                  <span class="res-stat-label">Spent</span>
                  <span class="res-stat-val val-red">-${formatCompact(s.spent)}</span>
                </div>
                <div class="res-stat-item">
                  <span class="res-stat-label">Net</span>
                  <span class="res-stat-val ${s.net >= 0 ? 'val-green' : 'val-red'}">${s.net >= 0 ? '+' : ''}${formatCompact(s.net)}</span>
                </div>
              </div>
            </div>
          `;
        });

        html += `
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Render Initial UI Shell
    function initUI() {
      // 0. Render Config-Driven Tab Bar
      renderTabBar();

      // 1. Military Queues
      const milContainer = document.getElementById("militaryList");
      if (milContainer) {
        milContainer.innerHTML = (state.mil || []).map((q, idx) => `
          <div class="card" id="milCard_${idx}">
            <div class="card-top">
              <span class="card-title">
                <span class="icon">${q.ic || '⚔️'}</span>
                <span>${q.n}</span>
              </span>
              <span class="pill pill-green" id="milSlot_${idx}">${q.s}/${q.m} slots</span>
            </div>
            <div class="timer-row">
              <span class="timer-val" id="milTimer_${idx}">--:--:--</span>
              <span class="timer-sub" id="milBatch_${idx}"></span>

        `).join('');
      }

      // 2. Workshop Card
      const wsContainer = document.getElementById("workshopCard");
      if (wsContainer) {
        wsContainer.innerHTML = `
          <div class="card">
            <div class="card-top">
              <span class="card-title">
                <span class="icon">🏭</span>
                <span id="wsTitle">Workshops</span>

              <span class="pill pill-green" id="wsPill">Producing</span>
            </div>
            <div class="timer-row">
              <span class="timer-val" id="wsTimer">--:--:--</span>
              <span class="timer-sub" id="wsSub"></span>
            </div>
            <!-- Power of Provision -->
            <div class="spell-banner" id="spellBanner">
              <div class="spell-info">
                <span class="spell-icon">✨</span>

            </div>
          </div>
        `;
      }

      // 3. Ancient Wonders Grid
      const awContainer = document.getElementById("awGrid");
      if (awContainer) {
        awContainer.innerHTML = (state.aw || []).map((aw, idx) => `
          <div class="mini-card" id="awCard_${idx}">
            <div>
              <div class="mini-title">
                <span>🏛️</span>
                <span title="${aw.n}">${aw.n}</span>
              </div>
              <div class="mini-sub">Level ${aw.l || 1}</div>

          </div>
        `).join('');
      }

      // 4. Pet Food Grid
      const petContainer = document.getElementById("petGrid");
      if (petContainer) {
        petContainer.innerHTML = (state.pet || []).map((pet, idx) => `
          <div class="mini-card" id="petCard_${idx}">
            <div>
              <div class="mini-title">
                <span>${pet.ic || '🍖'}</span>
                <span>${pet.n}</span>
              </div>
              <div class="mini-sub" id="petSub_${idx}">Pet Food</div>
            </div>
            <div class="mini-timer" id="petTimer_${idx}">--:--:--</div>
          </div>
        `).join('');
      }

      // 5. Render Resources Tab
      renderResourcesUI();

      // 6. Switch to Active Tab
      switchTab(currentTabId);
    }

    // Apply Realtime Fresh State from Live Stream (Silent & Seamless)
    function applyFreshState(freshState) {
      if (!freshState || !freshState.t) return;
      freshState.isDemo = false;
      state = freshState;
      initUI();
      tick();

      const badge = document.getElementById("liveBadgeText");
      if (badge) {
        badge.innerText = "STREAMING (LIVE)";
        badge.style.color = "#34d399";
      }
    }

    let lastTickTimestamp = Date.now();

    // Realtime Tick Function (Runs every 1 second)
    function tick() {
      const nowMs = Date.now();
      const elapsedSinceLastTick = nowMs - lastTickTimestamp;
      lastTickTimestamp = nowMs;

      // Detect phone unlock or app resume from background (>3.5s sleep gap)
      if (elapsedSinceLastTick > 3500) {
        onWakeUp("detected sleep gap " + Math.round(elapsedSinceLastTick / 1000) + "s");
      }

      const now = Math.floor(nowMs / 1000);

      // Header Sync Time
      const syncEl = document.getElementById("syncTime");
      if (syncEl) {
        if (state.isDemo) {
          syncEl.innerText = "⏳ Connecting to game data...";
        } else {
          const age = Math.max(0, now - (state.t || now));
          if (age < 5) syncEl.innerText = "⚡ Just updated (<5s)";
          else syncEl.innerText = `🟢 Synced ${age}s ago`;
        }
      }

      // 1. Military Update
      (state.mil || []).forEach((q, idx) => {
        const timerEl = document.getElementById(`milTimer_${idx}`);
        const slotEl = document.getElementById(`milSlot_${idx}`);
        const batchEl = document.getElementById(`milBatch_${idx}`);

        const totalRem = Math.max(0, (q.f || 0) - now);
        const batchRem = Math.max(0, (q.f1 || 0) - now);

        if (totalRem > 0 && q.s > 0) {
          timerEl.innerHTML = formatDuration(totalRem);
          timerEl.style.color = "#fff";
          slotEl.className = "pill pill-green";
          slotEl.innerText = `${q.s}/${q.m} slots`;
          batchEl.innerText = `Batch 1: ${formatDuration(batchRem)}`;
        } else {
          timerEl.innerHTML = '<span class="status-text idle">🔴 Queue Empty</span>';
          slotEl.className = "pill pill-rose";
          slotEl.innerText = `0/${q.m} slots`;
          batchEl.innerText = "Queue empty";
        }
      });

      // 2. Workshops Update
      const ws = state.ws || {};
      const wsTitle = document.getElementById("wsTitle");
      const wsPill = document.getElementById("wsPill");
      const wsTimer = document.getElementById("wsTimer");
      const wsSub = document.getElementById("wsSub");

      if (wsTitle) wsTitle.innerText = `${ws.c || 0}x Workshops (Lv.${ws.l || 15})`;

      const wsRem = Math.max(0, (ws.f || 0) - now);
      if (wsRem > 0 && ws.p > 0) {
        wsTimer.innerHTML = formatDuration(wsRem);
        wsTimer.style.color = "#fff";
        wsPill.className = "pill pill-green";
        wsPill.innerText = `Producing (${ws.p}/${ws.c})`;
        wsSub.innerText = ws.r > 0 ? `+ ${ws.r} ready` : "Producing";
      } else if (ws.r > 0 || (ws.f > 0 && wsRem === 0)) {
        wsTimer.innerHTML = '<span class="status-text ready">🟡 Ready to collect!</span>';
        wsPill.className = "pill pill-amber";
        wsPill.innerText = `Ready (${ws.r || ws.c}/${ws.c})`;
        wsSub.innerText = "Ready to collect";
      } else {
        wsTimer.innerHTML = '<span class="status-text idle">🔴 Idle</span>';
        wsPill.className = "pill pill-rose";
        wsPill.innerText = "Idle";
        wsSub.innerText = "No active production";
      }

      // Power of Provision Spell
      const spellBanner = document.getElementById("spellBanner");
      const spellTimer = document.getElementById("spellTimer");
      const spellRem = Math.max(0, (ws.pf || 0) - now);
      if (spellRem > 0) {
        spellTimer.innerHTML = formatDuration(spellRem);
        spellBanner.style.display = "flex";
      } else {
        spellTimer.innerHTML = "⚠️ Expired";
        spellTimer.style.color = "#f43f5e";
      }

      // 3. Ancient Wonders Update
      (state.aw || []).forEach((aw, idx) => {
        const timerEl = document.getElementById(`awTimer_${idx}`);
        const rem = Math.max(0, (aw.f || 0) - now);

        if (aw.s === "Producing" && rem > 0) {
          timerEl.innerHTML = formatDuration(rem);
          timerEl.style.color = "#fff";
        } else if (aw.s === "Ready" || (aw.s === "Producing" && aw.f > 0 && rem === 0)) {
          timerEl.innerHTML = '<span style="color:var(--accent-amber);font-size:12px;">🟡 Ready!</span>';
        } else if (aw.s === "Upgrading") {
          timerEl.innerHTML = `<span style="color:var(--accent-blue);font-size:12px;">🔨 Upgrading</span>`;
        } else {
          timerEl.innerHTML = '<span style="color:var(--text-muted);font-size:12px;">⚪ Idle</span>';
        }
      });

      // 4. Pet Food Update
      (state.pet || []).forEach((pet, idx) => {
        const timerEl = document.getElementById(`petTimer_${idx}`);
        const subEl = document.getElementById(`petSub_${idx}`);
        const rem = Math.max(0, (pet.f || 0) - now);

        if (rem > 0) {
          timerEl.innerHTML = formatDuration(rem);
          timerEl.style.color = "#34d399";
          subEl.innerText = "🟢 Buff active";
        } else {
          timerEl.innerHTML = '<span style="color:var(--accent-rose);font-size:12px;">🔴 Expired</span>';
          subEl.innerText = "Buff expired";
        }
      });
    }

    // --- TELEGRAM CLOUD DIRECT SYNC ENGINE (100% UNBLOCKABLE & NATIVE) ---
    const BOT_TOKEN = "8800181376:AAG2OenHRk37182rBE6AvtHkaUDCYR49V3A";

    function decodeCompactPayload(compact) {
      if (!compact || !compact.t) return null;
      
      const milDefs = [
        { id: "military_production", n: "Barracks", ic: "⚔️" },
        { id: "training_grounds_production", n: "Training Grounds", ic: "🏹" },
        { id: "mercenary_camp_production", n: "Mercenary Camp", ic: "🪄" }
      ];
      const mil = (compact.m || []).map((arr, idx) => ({
        id: milDefs[idx]?.id || `mil_${idx}`,
        n: milDefs[idx]?.n || "Barracks",
        ic: milDefs[idx]?.ic || "⚔️",
        f: arr[0] || 0,
        f1: arr[1] || 0,
        s: arr[2] || 0,
        m: arr[3] || 5
      }));

      const w = compact.w || [0, 15, 0, 0, 0, 0];
      const ws = {
        c: w[0] || 0,
        l: w[1] || 15,
        f: w[2] || 0,
        p: w[3] || 0,
        r: w[4] || 0,
        pf: w[5] || 0
      };

      const awDefs = [
        { n: "Golden Abyss" },
        { n: "Prosperity Towers" },
        { n: "Maze of the Dark Matter" }
      ];
      const aw = (compact.a || []).map((arr, idx) => {
        const sChar = arr[1] || "I";
        const status = sChar === "P" ? "Producing" : (sChar === "R" ? "Ready" : (sChar === "U" ? "Upgrading" : "Idle"));
        return {
          n: awDefs[idx]?.n || `AW ${idx+1}`,
          l: arr[0] || 0,
          s: status,
          f: arr[2] || 0
        };
      });

      const petDefs = [
        { n: "Brown Bear", ic: "🐻" },
        { n: "Shellux", ic: "🐌" }
      ];
      const pet = (compact.p || []).map((f, idx) => ({
        n: petDefs[idx]?.n || `Pet ${idx+1}`,
        ic: petDefs[idx]?.ic || "🐾",
        f: f || 0
      }));

      // 5. Standard Goods Resources (T1, T2, T3)
      const rawR = compact.r || [];
      const goodsMeta = [
        { id: "marble", name: "Marble", icon: "🏛️", tier: 1 },
        { id: "steel", name: "Steel", icon: "🔩", tier: 1 },
        { id: "planks", name: "Planks", icon: "🪵", tier: 1 },
        { id: "crystal", name: "Crystal", icon: "💎", tier: 2 },
        { id: "scrolls", name: "Scrolls", icon: "📜", tier: 2 },
        { id: "silk", name: "Silk", icon: "🧵", tier: 2 },
        { id: "elixir", name: "Elixir", icon: "🧪", tier: 3 },
        { id: "magic_dust", name: "Magic Dust", icon: "✨", tier: 3 },
        { id: "gems", name: "Gems", icon: "🔮", tier: 3 }
      ];

      const res = goodsMeta.map((item, idx) => {
        const row = rawR[idx] || [0, 0, 0, 0, 0];
        return {
          id: item.id,
          name: item.name,
          icon: item.icon,
          tier: item.tier,
          cur: row[0] || 0,
          todayEarn: row[1] || 0,
          todaySpent: row[2] || 0,
          weekEarn: row[3] || 0,
          weekSpent: row[4] || 0
        };
      });

      return { t: compact.t, mil, ws, aw, pet, res };
    }

    const ZW_CHARS = ['\u200B', '\u200C', '\u200D', '\u2060'];
    const ZW_START = '\uFEFF';

    function decodeZeroWidthPayload(text) {
      if (!text) return null;
      const start = text.indexOf(ZW_START);
      if (start === -1) return null;
      const chars = text.slice(start + 1);
      let binaryStr = '';
      for (let i = 0; i < chars.length; i += 4) {
        if (i + 3 >= chars.length) break;
        const v0 = ZW_CHARS.indexOf(chars[i]);
        const v1 = ZW_CHARS.indexOf(chars[i+1]);
        const v2 = ZW_CHARS.indexOf(chars[i+2]);
        const v3 = ZW_CHARS.indexOf(chars[i+3]);
        if (v0 === -1 || v1 === -1 || v2 === -1 || v3 === -1) break;
        const code = (v0 << 6) | (v1 << 4) | (v2 << 2) | v3;
        binaryStr += String.fromCharCode(code);
      }
      return decodeURIComponent(escape(binaryStr));
    }

    const PRIMARY_CHAT_ID = "-1003909496356"; // Group Chat (Topic 26 pinned message 1038) - 100% operational, zero rate limits
    const FALLBACK_CHAT_ID = "7620170971";    // Private Chat (Pinned message 27)
    let isFetchingTelegram = false;
    let fetchStartTime = 0;

    function fetchChatPayload(chatId, signal) {
      return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getChat?chat_id=${chatId}&t=${Date.now()}`, { signal })
        .then(res => res.json())
        .then(json => {
          if (json.ok && json.result && json.result.pinned_message && json.result.pinned_message.text) {
            const text = json.result.pinned_message.text;
            let compact = null;

            // 1. Zero-Width Steganography decoding
            try {
              const zwDecoded = decodeZeroWidthPayload(text);
              if (zwDecoded) compact = JSON.parse(zwDecoded);
            } catch(e) {}

            // 2. Fallback legacy SYNC:...
            if (!compact) {
              const match = text.match(/SYNC:([A-Za-z0-9+/=_-]+)/);
              if (match) {
                try {
                  let clean = match[1].replace(/-/g, '+').replace(/_/g, '/');
                  while (clean.length % 4) clean += '=';
                  compact = JSON.parse(decodeURIComponent(escape(atob(clean))));
                } catch(e) {}
              }
            }

            if (compact) {
              return decodeCompactPayload(compact);
            }
          }
          return null;
        })
        .catch(err => {
          if (err.name !== 'AbortError') {
            console.warn(`[Telegram Cloud] Fetch error for chat ${chatId}:`, err);
          }
          return null;
        });
    }

    function syncFromTelegramCloud(force = false) {
      if (isFetchingTelegram && !force) {
        // Auto-release lock if previous request was hanging >6s due to poor network or sleep
        if (Date.now() - fetchStartTime > 6000) {
          console.warn("[Telegram Cloud] Lock held >6s, auto-releasing");
          isFetchingTelegram = false;
        } else {
          return;
        }
      }
      isFetchingTelegram = true;
      fetchStartTime = Date.now();

      // AbortController prevents hanging indefinitely on network loss
      const controller = new AbortController();
      const timeoutId = setTimeout(() => {
        try { controller.abort(); } catch(e) {}
      }, 5000);

      // Dual-Source Failover: Try Group Chat Topic 26 first (bulletproof), fallback to Private Chat
      fetchChatPayload(PRIMARY_CHAT_ID, controller.signal)
        .then(data => {
          if (data && data.t) return data;
          // Fallback to Private Chat if Group Chat returned null
          return fetchChatPayload(FALLBACK_CHAT_ID, controller.signal);
        })
        .then(decoded => {
          if (decoded && decoded.t && (state.isDemo || decoded.t !== (state.t || 0))) {
            applyFreshState(decoded);
          }
          const badgeText = document.getElementById("liveBadgeText");
          if (badgeText) badgeText.innerText = "STREAMING (LIVE)";
        })
        .catch(err => {
          if (err.name !== 'AbortError') {
            console.warn("Telegram sync warning:", err);
          }
          const badgeText = document.getElementById("liveBadgeText");
          if (badgeText && state.isDemo) badgeText.innerText = "CONNECTING...";
        })
        .finally(() => {
          clearTimeout(timeoutId);
          isFetchingTelegram = false;
        });
    }

    // --- SLEEP / RESUME LIFECYCLE & AUTOMATIC RECONNECTION ENGINE ---
    function onWakeUp(reason) {
      console.log(`[Lifecycle] Wake up (${reason}) -> Resyncing immediately`);
      isFetchingTelegram = false;
      syncFromTelegramCloud(true);
      tick();
    }

    // 1. Detect screen unlock or tab visibility change
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        onWakeUp("visibilitychange - visible");
      }
    });

    // 2. Detect app resume when switching back to Telegram
    window.addEventListener("focus", () => onWakeUp("window focus"));
    window.addEventListener("pageshow", () => onWakeUp("pageshow / bfcache"));

    // 3. Listen to Telegram WebApp SDK viewport change event
    if (tg && typeof tg.onEvent === 'function') {
      try {
        tg.onEvent('viewportChanged', () => onWakeUp("tg viewportChanged"));
      } catch(e) {}
    }

    function reconnectStream() {
      showToast("🔄 Re-syncing...");
      onWakeUp("manual click");
    }

    // Initial Execution
    initUI();
    tick();
    setInterval(tick, 1000);
    syncFromTelegramCloud();
    // High-frequency Realtime Polling via Telegram Cloud (every 2 seconds)
    setInterval(syncFromTelegramCloud, 2000);
  </script>
