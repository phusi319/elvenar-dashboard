<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Elvenar Live Radar</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-green-bg: rgba(16, 185, 129, 0.15);
      --accent-amber: #f59e0b;
      --accent-amber-bg: rgba(245, 158, 11, 0.15);
      --accent-rose: #f43f5e;
      --accent-rose-bg: rgba(244, 63, 94, 0.15);
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 14px 60px 14px;
      overflow-x: hidden;
      line-height: 1.4;
    }

    /* Ambient Glow Background */
    body::before {
      content: "";
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 26px;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.4));
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-green-bg);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Section Styles */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 18px 4px 8px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Card Layout */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 9px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .card:active {
      transform: scale(0.99);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .card-title .icon {
      font-size: 17px;
    }

    .pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill-green {
      background: var(--accent-green-bg);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .pill-amber {
      background: var(--accent-amber-bg);
      color: var(--accent-amber);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .pill-rose {
      background: var(--accent-rose-bg);
      color: var(--accent-rose);
      border: 1px solid rgba(244, 63, 94, 0.25);
    }

    .pill-blue {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    /* Timer Display */
    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 4px;
    }

    .timer-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .timer-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-text {
      font-size: 13px;
      font-weight: 600;
    }

    .status-text.ready {
      color: var(--accent-amber);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-text.idle {
      color: var(--accent-rose);
    }

    /* Provision Spell Banner */
    .spell-banner {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12) 0%, rgba(217, 119, 6, 0.05) 100%);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .spell-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spell-icon {
      font-size: 18px;
      filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.6));
    }

    .spell-name {
      font-size: 12px;
      font-weight: 700;
      color: #fef08a;
    }

    .spell-timer {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      font-weight: 700;
      color: #fef08a;
    }

    /* Grid for AWs and Pets */
    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mini-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 82px;
    }

    .mini-title {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-timer {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-top: 6px;
    }

    .mini-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Footer Buttons */
    .footer {
      margin-top: 24px;
      text-align: center;
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-close:active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .sync-note {
      font-size: 11px;
      color: #64748b;
      margin-top: 10px;
    }

    /* Live Update Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.3s;
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="brand-icon">🏰</span>
        <div class="brand-text">
          <h1>Elvenar Live Radar</h1>
          <p id="syncTime">Đang kết nối dữ liệu...</p>
        </div>
      </div>
      <div class="live-badge" id="liveBadge" onclick="reconnectStream()">
        <span class="pulse-dot"></span>
        <span id="liveBadgeText">STREAMING (LIVE)</span>
      </div>
    </header>

    <!-- 1. Military Queues -->
    <div class="section-title">
      <span>⚔️</span> Doanh Trại & Luyện Quân
    </div>
    <div id="militaryList">
      <!-- Injected via JS -->
    </div>

    <!-- 2. Main Workshops -->
    <div class="section-title">
      <span>🏭</span> Xưởng Sản Xuất Chính
    </div>
    <div id="workshopCard">
      <!-- Injected via JS -->
    </div>

    <!-- 3. Ancient Wonders -->
    <div class="section-title">
      <span>🏛️</span> Kỳ Quan Cổ Đại (Ancient Wonders)
    </div>
    <div class="two-col-grid" id="awGrid">
      <!-- Injected via JS -->
    </div>

    <!-- 4. Pet Food Buffs -->
    <div class="section-title">
      <span>🍖</span> Thức Ăn Thú Cưng (Pet Food)
    </div>
    <div class="two-col-grid" id="petGrid">
      <!-- Injected via JS -->
    </div>

    <!-- Footer -->
    <footer class="footer">
      <button class="btn-close" onclick="closeWebApp()">Đóng Dashboard</button>
      <p class="sync-note" id="syncDetails">Kết nối Realtime SSE (<1s) • Dữ liệu từ PC Game Client</p>
    </footer>

    <!-- Toast Notification -->
    <div id="liveToast" class="toast">✨ Game vừa cập nhật mẻ mới!</div>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function triggerHaptic() {
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    }

    function closeWebApp() {
      triggerHaptic();
      if (tg) tg.close();
      else window.close();
    }

    function showToast(msg) {
      const t = document.getElementById("liveToast");
      if (!t) return;
      t.innerText = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    // Format Seconds to HH:MM:SS
    function formatDuration(sec) {
      const s = Math.max(0, Math.floor(sec));
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const remSec = s % 60;

      if (d > 0) {
        return `${d}d ${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m`;
      }
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(remSec).padStart(2, '0')}`;
    }

    // Parse Data from URL Hash or Search Params
    function getPayload() {
      try {
        let raw = "";
        const hash = window.location.hash;
        const search = window.location.search;

        if (hash && hash.includes("d=")) {
          raw = hash.split("d=")[1].split("&")[0];
        } else if (search && search.includes("d=")) {
          const params = new URLSearchParams(search);
          raw = params.get("d") || "";
        }

        if (raw) {
          let clean = raw.replace(/-/g, '+').replace(/_/g, '/');
          while (clean.length % 4) clean += '=';
          const decodedStr = decodeURIComponent(escape(atob(clean)));
          return JSON.parse(decodedStr);
        }
      } catch (e) {
        console.error("Lỗi giải mã payload:", e);
      }

      // Fallback if opened directly without URL hash
      return {
        isDemo: true,
        t: 0,
        mil: [
          { id: "b", n: "Barracks", ic: "⚔️", f: 0, f1: 0, s: 0, m: 5 },
          { id: "tg", n: "Training Grounds", ic: "🏹", f: 0, f1: 0, s: 0, m: 5 },
          { id: "mc", n: "Mercenary Camp", ic: "🪄", f: 0, f1: 0, s: 0, m: 5 }
        ],
        ws: { c: 4, l: 15, f: 0, p: 0, r: 0, i: 0, st: 0, pf: 0 },
        aw: [
          { n: "Golden Abyss", l: 0, s: "Idle", f: 0 },
          { n: "Prosperity Towers", l: 0, s: "Idle", f: 0 },
          { n: "Maze of Dark Matter", l: 0, s: "Idle", f: 0 }
        ],
        pet: [
          { n: "Brown Bear", ic: "🐻", f: 0 },
          { n: "Shellux", ic: "🐌", f: 0 }
        ]
      };
    }

    let state = getPayload();

    // Render Initial UI Shell
    function initUI() {
      // 1. Military Queues
      const milContainer = document.getElementById("militaryList");
      milContainer.innerHTML = (state.mil || []).map((q, idx) => `
        <div class="card" id="milCard_${idx}">
          <div class="card-top">
            <span class="card-title">
              <span class="icon">${q.ic || '⚔️'}</span>
              <span>${q.n}</span>
            </span>
            <span class="pill pill-green" id="milSlot_${idx}">${q.s}/${q.m} slots</span>
          </div>
          <div class="timer-row">
            <span class="timer-val" id="milTimer_${idx}">--:--:--</span>
            <span class="timer-sub" id="milBatch_${idx}"></span>
          </div>
        </div>
      `).join('');

      // 2. Workshop Card
      const wsContainer = document.getElementById("workshopCard");
      wsContainer.innerHTML = `
        <div class="card">
          <div class="card-top">
            <span class="card-title">
              <span class="icon">🏭</span>
              <span id="wsTitle">Workshops</span>
            </span>
            <span class="pill pill-green" id="wsPill">Đang chạy</span>
          </div>
          <div class="timer-row">
            <span class="timer-val" id="wsTimer">--:--:--</span>
            <span class="timer-sub" id="wsSub"></span>
          </div>
          <!-- Power of Provision -->
          <div class="spell-banner" id="spellBanner">
            <div class="spell-info">
              <span class="spell-icon">✨</span>
              <span class="spell-name">Power of Provision</span>
            </div>
            <span class="spell-timer" id="spellTimer">--:--:--</span>
          </div>
        </div>
      `;

      // 3. Ancient Wonders Grid
      const awContainer = document.getElementById("awGrid");
      awContainer.innerHTML = (state.aw || []).map((aw, idx) => `
        <div class="mini-card" id="awCard_${idx}">
          <div>
            <div class="mini-title">
              <span>🏛️</span>
              <span title="${aw.n}">${aw.n}</span>
            </div>
            <div class="mini-sub">Cấp ${aw.l || 1}</div>
          </div>
          <div class="mini-timer" id="awTimer_${idx}">--:--:--</div>
        </div>
      `).join('');

      // 4. Pet Food Grid
      const petContainer = document.getElementById("petGrid");
      petContainer.innerHTML = (state.pet || []).map((pet, idx) => `
        <div class="mini-card" id="petCard_${idx}">
          <div>
            <div class="mini-title">
              <span>${pet.ic || '🍖'}</span>
              <span>${pet.n}</span>
            </div>
            <div class="mini-sub" id="petSub_${idx}">Thức ăn</div>
          </div>
          <div class="mini-timer" id="petTimer_${idx}">--:--:--</div>
        </div>
      `).join('');
    }

    // Apply Realtime Fresh State from Live Stream (Silent & Seamless)
    function applyFreshState(freshState) {
      if (!freshState || !freshState.t) return;
      freshState.isDemo = false;
      state = freshState;
      initUI();
      tick();

      const badge = document.getElementById("liveBadgeText");
      if (badge) {
        badge.innerText = "STREAMING (LIVE)";
        badge.style.color = "#34d399";
      }
    }

    // Realtime Tick Function (Runs every 1 second)
    function tick() {
      const now = Math.floor(Date.now() / 1000);

      // Header Sync Time
      const syncEl = document.getElementById("syncTime");
      if (syncEl) {
        if (state.isDemo) {
          syncEl.innerText = "⏳ Đang kết nối nạp dữ liệu từ game...";
        } else {
          const age = Math.max(0, now - (state.t || now));
          if (age < 5) syncEl.innerText = "⚡ Vừa cập nhật tức thì (<5s)";
          else syncEl.innerText = `🟢 Cập nhật từ game ${age}s trước`;
        }
      }

      // 1. Military Update
      (state.mil || []).forEach((q, idx) => {
        const timerEl = document.getElementById(`milTimer_${idx}`);
        const slotEl = document.getElementById(`milSlot_${idx}`);
        const batchEl = document.getElementById(`milBatch_${idx}`);

        const totalRem = Math.max(0, (q.f || 0) - now);
        const batchRem = Math.max(0, (q.f1 || 0) - now);

        if (totalRem > 0 && q.s > 0) {
          timerEl.innerHTML = formatDuration(totalRem);
          timerEl.style.color = "#fff";
          slotEl.className = "pill pill-green";
          slotEl.innerText = `${q.s}/${q.m} slots`;
          batchEl.innerText = `Lô 1: ${formatDuration(batchRem)}`;
        } else {
          timerEl.innerHTML = '<span class="status-text idle">🔴 Đang Trống</span>';
          slotEl.className = "pill pill-rose";
          slotEl.innerText = `0/${q.m} slots`;
          batchEl.innerText = "Cần nạp lính";
        }
      });

      // 2. Workshops Update
      const ws = state.ws || {};
      const wsTitle = document.getElementById("wsTitle");
      const wsPill = document.getElementById("wsPill");
      const wsTimer = document.getElementById("wsTimer");
      const wsSub = document.getElementById("wsSub");

      if (wsTitle) wsTitle.innerText = `${ws.c || 0}x Workshops (Lv.${ws.l || 15})`;

      const wsRem = Math.max(0, (ws.f || 0) - now);
      if (wsRem > 0 && ws.p > 0) {
        wsTimer.innerHTML = formatDuration(wsRem);
        wsTimer.style.color = "#fff";
        wsPill.className = "pill pill-green";
        wsPill.innerText = `Đang chạy (${ws.p}/${ws.c})`;
        wsSub.innerText = ws.r > 0 ? `+ ${ws.r} đã xong` : "Đang sản xuất";
      } else if (ws.r > 0 || (ws.f > 0 && wsRem === 0)) {
        wsTimer.innerHTML = '<span class="status-text ready">🟡 Ready to collect!</span>';
        wsPill.className = "pill pill-amber";
        wsPill.innerText = `Sẵn sàng (${ws.r || ws.c}/${ws.c})`;
        wsSub.innerText = "Chờ gom hàng";
      } else {
        wsTimer.innerHTML = '<span class="status-text idle">🔴 Bị Bỏ Trống</span>';
        wsPill.className = "pill pill-rose";
        wsPill.innerText = "Idle";
        wsSub.innerText = "Không có sản xuất";
      }

      // Power of Provision Spell
      const spellBanner = document.getElementById("spellBanner");
      const spellTimer = document.getElementById("spellTimer");
      const spellRem = Math.max(0, (ws.pf || 0) - now);
      if (spellRem > 0) {
        spellTimer.innerHTML = formatDuration(spellRem);
        spellBanner.style.display = "flex";
      } else {
        spellTimer.innerHTML = "⚠️ Hết hạn";
        spellTimer.style.color = "#f43f5e";
      }

      // 3. Ancient Wonders Update
      (state.aw || []).forEach((aw, idx) => {
        const timerEl = document.getElementById(`awTimer_${idx}`);
        const rem = Math.max(0, (aw.f || 0) - now);

        if (aw.s === "Producing" && rem > 0) {
          timerEl.innerHTML = formatDuration(rem);
          timerEl.style.color = "#fff";
        } else if (aw.s === "Ready" || (aw.s === "Producing" && aw.f > 0 && rem === 0)) {
          timerEl.innerHTML = '<span style="color:var(--accent-amber);font-size:12px;">🟡 Ready!</span>';
        } else if (aw.s === "Upgrading") {
          timerEl.innerHTML = `<span style="color:var(--accent-blue);font-size:12px;">🔨 Upgrading</span>`;
        } else {
          timerEl.innerHTML = '<span style="color:var(--text-muted);font-size:12px;">⚪ Idle</span>';
        }
      });

      // 4. Pet Food Update
      (state.pet || []).forEach((pet, idx) => {
        const timerEl = document.getElementById(`petTimer_${idx}`);
        const subEl = document.getElementById(`petSub_${idx}`);
        const rem = Math.max(0, (pet.f || 0) - now);

        if (rem > 0) {
          timerEl.innerHTML = formatDuration(rem);
          timerEl.style.color = "#34d399";
          subEl.innerText = "🟢 Đang có buff";
        } else {
          timerEl.innerHTML = '<span style="color:var(--accent-rose);font-size:12px;">🔴 Hết thức ăn</span>';
          subEl.innerText = "Đã hết hạn";
        }
      });
    }

    // --- TELEGRAM CLOUD DIRECT SYNC ENGINE (100% UNBLOCKABLE & NATIVE) ---
    const BOT_TOKEN = "8800181376:AAG2OenHRk37182rBE6AvtHkaUDCYR49V3A";

    function decodeCompactPayload(compact) {
      if (!compact || !compact.t) return null;
      
      const milDefs = [
        { id: "military_production", n: "Barracks", ic: "⚔️" },
        { id: "training_grounds_production", n: "Training Grounds", ic: "🏹" },
        { id: "mercenary_camp_production", n: "Mercenary Camp", ic: "🪄" }
      ];
      const mil = (compact.m || []).map((arr, idx) => ({
        id: milDefs[idx]?.id || `mil_${idx}`,
        n: milDefs[idx]?.n || "Barracks",
        ic: milDefs[idx]?.ic || "⚔️",
        f: arr[0] || 0,
        f1: arr[1] || 0,
        s: arr[2] || 0,
        m: arr[3] || 5
      }));

      const w = compact.w || [0, 15, 0, 0, 0, 0];
      const ws = {
        c: w[0] || 0,
        l: w[1] || 15,
        f: w[2] || 0,
        p: w[3] || 0,
        r: w[4] || 0,
        pf: w[5] || 0
      };

      const awDefs = [
        { n: "Golden Abyss" },
        { n: "Prosperity Towers" },
        { n: "Maze of the Dark Matter" }
      ];
      const aw = (compact.a || []).map((arr, idx) => {
        const sChar = arr[1] || "I";
        const status = sChar === "P" ? "Producing" : (sChar === "R" ? "Ready" : (sChar === "U" ? "Upgrading" : "Idle"));
        return {
          n: awDefs[idx]?.n || `AW ${idx+1}`,
          l: arr[0] || 0,
          s: status,
          f: arr[2] || 0
        };
      });

      const petDefs = [
        { n: "Brown Bear", ic: "🐻" },
        { n: "Shellux", ic: "🐌" }
      ];
      const pet = (compact.p || []).map((f, idx) => ({
        n: petDefs[idx]?.n || `Pet ${idx+1}`,
        ic: petDefs[idx]?.ic || "🐾",
        f: f || 0
      }));

      return { t: compact.t, mil, ws, aw, pet };
    }

    const CHAT_ID = "-1003909496356";
    let isFetchingTelegram = false;

    function syncFromTelegramCloud() {
      if (isFetchingTelegram) return;
      isFetchingTelegram = true;

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getChat?chat_id=${CHAT_ID}&t=${Date.now()}`)
        .then(res => res.json())
        .then(json => {
          if (json.ok && json.result && json.result.pinned_message && json.result.pinned_message.text) {
            const text = json.result.pinned_message.text;
            const match = text.match(/SYNC:([A-Za-z0-9+/=_-]+)/);
            if (match) {
              try {
                let clean = match[1].replace(/-/g, '+').replace(/_/g, '/');
                while (clean.length % 4) clean += '=';
                const jsonStr = decodeURIComponent(escape(atob(clean)));
                const compact = JSON.parse(jsonStr);
                const decoded = decodeCompactPayload(compact);
                if (decoded && (state.isDemo || decoded.t !== (state.t || 0))) {
                  applyFreshState(decoded);
                }
              } catch(e) {
                console.error("Lỗi parse SYNC payload:", e);
              }
            }
          }
          const badgeText = document.getElementById("liveBadgeText");
          if (badgeText) badgeText.innerText = "STREAMING (LIVE)";
        })
        .catch(err => {
          console.warn("Telegram sync warning:", err);
          const badgeText = document.getElementById("liveBadgeText");
          if (badgeText) badgeText.innerText = "CONNECTING...";
        })
        .finally(() => {
          isFetchingTelegram = false;
        });
    }

    function reconnectStream() {
      triggerHaptic();
      showToast("🔄 Đang đồng bộ lại...");
      syncFromTelegramCloud();
    }

    // Initial Execution
    initUI();
    tick();
    setInterval(tick, 1000);
    syncFromTelegramCloud();
    // High-frequency Realtime Polling via Telegram Cloud (every 2 seconds)
    setInterval(syncFromTelegramCloud, 2000);
  </script>
